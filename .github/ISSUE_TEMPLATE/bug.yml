name: Bug
description: Something in Aeko is broken
title: "[Bug] "
labels: ["bug"]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you expected, and what you saw instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps
      description: How to reproduce it. Leave out keys and message contents.
    validations:
      required: true
  - type: input
    id: where
    attributes:
      label: Where
      placeholder: Web, Android, or both
    validations:
      required: true
