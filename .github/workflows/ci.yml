name: CI

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: write

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    env:
      AUTH_SECRET: ci-build-placeholder-not-production
      AUTH_GITHUB_ID: dummy
      AUTH_GITHUB_SECRET: dummy
      AUTH_GOOGLE_ID: dummy
      AUTH_GOOGLE_SECRET: dummy
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run build

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Make Gradle wrapper executable
        run: chmod +x gradlew
      - name: Decode release keystore
        env:
          LYAN_KEYSTORE_BASE64: ${{ secrets.LYAN_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$LYAN_KEYSTORE_BASE64" ]; then
            echo "$LYAN_KEYSTORE_BASE64" | base64 -d > release.keystore
          fi
      - name: Build release APK
        env:
          LYAN_KEYSTORE_PASSWORD: ${{ secrets.LYAN_KEYSTORE_PASSWORD }}
          LYAN_KEY_ALIAS: ${{ secrets.LYAN_KEY_ALIAS }}
          LYAN_KEY_PASSWORD: ${{ secrets.LYAN_KEY_PASSWORD }}
          GITHUB_SHA: ${{ github.sha }}
          GITHUB_RUN_NUMBER: ${{ github.run_number }}
        run: ./gradlew assembleRelease --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: lyan-apk
          path: app/build/outputs/apk/release/*.apk
      - name: Publish latest GitHub Release
        if: github.event_name == 'push' && (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          APK=$(ls app/build/outputs/apk/release/*.apk | head -n 1)
          cp "$APK" Lyan.apk
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest Lyan.apk --title "Lyan latest" --notes "Installable APK from commit ${GITHUB_SHA}. Rolling release from current master."
